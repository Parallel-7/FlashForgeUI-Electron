name: CI

on:
  push:
    branches: [main, alpha]
  pull_request:
    branches: [main, alpha]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FlashForgeUI
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure GitHub Packages Authentication
        shell: bash
        run: |
          echo "@ghosttypes:registry=https://npm.pkg.github.com" >> .npmrc
          echo "@parallel-7:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build (main + renderer + webui)
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  e2e-emulator:
    name: E2E (emulator + WebUI)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout FlashForgeUI
        uses: actions/checkout@v4

      # The emulator lives in a separate public repo and provides the printers this
      # track drives, so no real hardware is needed.
      - name: Checkout flashforge-emulator-v2
        uses: actions/checkout@v4
        with:
          repository: GhostTypes/flashforge-emulator-v2
          path: emulator

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure GitHub Packages Authentication
        shell: bash
        run: |
          echo "@ghosttypes:registry=https://npm.pkg.github.com" >> .npmrc
          echo "@parallel-7:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install emulator dependencies
        working-directory: emulator
        run: npm ci

      # The browser track needs the chromium binary itself, not just its system libraries.
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # Electron refuses to start if its SUID sandbox helper is not root-owned and
      # setuid, which is how pnpm unpacks it. Fixing the binary keeps the app launching
      # exactly as it does for users, rather than weakening it with --no-sandbox.
      - name: Enable the Electron sandbox helper
        run: |
          ELECTRON_DIR="$(dirname "$(node -p "require('electron')")")"
          sudo chown root:root "$ELECTRON_DIR/chrome-sandbox"
          sudo chmod 4755 "$ELECTRON_DIR/chrome-sandbox"

      # The suite drives a real Electron window, so CI needs a virtual display.
      - name: Run emulator E2E track
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm test:e2e:electron:emulator
        env:
          FF_EMULATOR_ROOT: ${{ github.workspace }}/emulator

      # Browser coverage of the WebUI. It launches the real app with --headless against the
      # same emulator, so it needs Electron and a display too - hence this job rather than
      # the fast verify one. Runs even if the Electron track failed, since the two cover
      # different surfaces and one failing should not hide the other.
      - name: Run WebUI browser E2E
        if: success() || failure()
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm test:e2e
        env:
          FF_EMULATOR_ROOT: ${{ github.workspace }}/emulator

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
